<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Administración — Encuesta del museo</title>
<style>
  :root{--bg:#06090d;--fg:#d6e2dc;--muted:#8fa39a;--acc:#00ffcc;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px 16px}
  main{max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.6}
  button{background:#0d5244;border:1px solid rgba(0,255,204,.4);color:#fff;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;margin:6px 8px 6px 0}
  button:disabled{opacity:.45;cursor:default}
  #estado{font-size:13px;color:var(--acc);margin:10px 0}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:rgba(255,255,255,.04);position:sticky;top:0}
  td.txt{white-space:normal;min-width:240px}
</style>
</head>
<body>
<main>
  <h1>Encuesta del museo — administración</h1>
  <p>Solo la cuenta autorizada en las reglas de Firestore puede leer las respuestas completas. Inicia sesión con esa cuenta de Google y descarga el CSV para el análisis del Capítulo 4.</p>
  <button id="login">Iniciar sesión con Google</button>
  <button id="csv" disabled>Descargar CSV</button>
  <button id="logout" disabled>Cerrar sesión</button>
  <div id="estado"></div>
  <div class="wrap"><table id="tabla"></table></div>
</main>
<script type="module">
import { FIREBASE_CONFIG, firebaseConfigurado } from "./js/firebase.js";
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const estado = document.getElementById("estado");
const COLS = ["fecha","nombre","edad","genero","p1","p2","p3","p4","p5","p6","p7","p8","p9","p10","publicar"];
let filas = [];

if (!firebaseConfigurado()) {
  estado.textContent = "Falta pegar la configuración de Firebase en js/firebase.js.";
  document.getElementById("login").disabled = true;
} else {
  const { initializeApp } = await import(SDK + "firebase-app.js");
  const auth = await import(SDK + "firebase-auth.js");
  const fs = await import(SDK + "firebase-firestore.js");
  const app = initializeApp(FIREBASE_CONFIG);
  const a = auth.getAuth(app), db = fs.getFirestore(app);

  document.getElementById("login").onclick = () => auth.signInWithPopup(a, new auth.GoogleAuthProvider());
  document.getElementById("logout").onclick = () => auth.signOut(a);
  document.getElementById("csv").onclick = descargar;

  auth.onAuthStateChanged(a, async user => {
    document.getElementById("logout").disabled = !user;
    document.getElementById("login").disabled = !!user;
    if (!user) { estado.textContent = "Sin sesión."; filas = []; pintar(); document.getElementById("csv").disabled = true; return; }
    estado.textContent = `Sesión: ${user.email}. Cargando respuestas…`;
    try {
      const snap = await fs.getDocs(fs.query(fs.collection(db, "respuestas"), fs.orderBy("fecha", "asc")));
      filas = snap.docs.map(d => {
        const x = d.data();
        return { ...x, fecha: x.fecha?.toDate ? x.fecha.toDate().toISOString().replace("T", " ").slice(0, 19) : "" };
      });
      estado.textContent = `${filas.length} respuestas.`;
      document.getElementById("csv").disabled = !filas.length;
      pintar();
    } catch (e) {
      estado.textContent = "Esta cuenta no tiene permiso para leer las respuestas (revisa el correo en las reglas de Firestore).";
    }
  });
}

function pintar() {
  const t = document.getElementById("tabla");
  t.innerHTML = "";
  if (!filas.length) return;
  const tr = t.insertRow(); COLS.forEach(c => { const th = document.createElement("th"); th.textContent = c; tr.append(th); });
  filas.forEach(f => {
    const r = t.insertRow();
    COLS.forEach(c => { const td = r.insertCell(); td.textContent = f[c] ?? ""; if (c === "p10" || c === "p8") td.className = "txt"; });
  });
}

function descargar() {
  const esc = v => { const s = String(v ?? ""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [COLS.join(","), ...filas.map(f => COLS.map(c => esc(f[c])).join(","))].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const aEl = document.createElement("a");
  aEl.href = url; aEl.download = `respuestas_encuesta_${new Date().toISOString().slice(0, 10)}.csv`;
  aEl.click(); URL.revokeObjectURL(url);
}
</script>
</body>
</html>
